name: Linux external calculation research
on:
  workflow_dispatch:
    inputs:
      driver:
        description: Conversion-only control or explicit UNO calculateAll
        type: choice
        options:
          - uno
          - cli
        default: uno
permissions:
  contents: read
jobs:
  synthetic-calculation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install distribution engine for this disposable research job
        shell: bash
        run: |
          sudo apt-get update -qq > "$RUNNER_TEMP/apt-update.log" 2>&1
          sudo apt-get install --no-install-recommends -y libreoffice-calc python3-uno > "$RUNNER_TEMP/apt-install.log" 2>&1
          dpkg-query --show --showformat='${Package} ${Version}\n' libreoffice-core libreoffice-calc python3-uno
      - name: Compare only authored synthetic cases
        shell: bash
        env:
          DRIVER: ${{ inputs.driver }}
        run: |
          /usr/bin/python3 .github/scripts/linux-calc-probe.py --driver "$DRIVER"
      # Deliberately no workbook, profile, conversion log, or results upload.
