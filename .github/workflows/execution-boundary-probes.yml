name: Rust execution and mutation research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the existing shared dependency lock
        shell: bash
        run: cargo +1.99.1 metadata --locked --format-version 1 --manifest-path crates/workbook-import-research/Cargo.toml > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-shared-lock
          path: crates/workbook-import-research/Cargo.lock
          if-no-files-found: error
          retention-days: 7
  portable:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: execution-shared-lock
          path: crates/workbook-import-research
      - name: Execution supervisor fault controls
        id: controls
        shell: bash
        run: python crates/workbook-import-research/test_execution_controls.py --result-file "$RUNNER_TEMP/execution-controls.private.json"
      - name: Format and build exact-source execution diagnostic
        id: build
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          cargo +1.99.1 fmt --manifest-path crates/workbook-import-research/Cargo.toml
          cargo +1.99.1 metadata --locked --format-version 1 --manifest-path crates/workbook-import-research/Cargo.toml > execution-dependencies.json
          cargo +1.99.1 build --locked --release --target "$TARGET" --manifest-path crates/workbook-import-research/Cargo.toml --bin formualizer-execution-boundary-probe
      - name: Native execution calibration controls
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +1.99.1 test --locked --release --target "$TARGET" --manifest-path crates/workbook-import-research/Cargo.toml --bin formualizer-execution-boundary-probe
      - name: Package executable and provenance
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python .github/scripts/package-execution.py --target "$TARGET"
      - name: Retain selected executable and provenance
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-${{ matrix.target }}
          path: execution-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Collect every execution and mutation case
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.controls.outcome == 'success' && steps.package.outcome == 'success' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NATIVE_CONTROL_OUTCOME: ${{ steps.native.outcome }}
        run: |
          echo "Native calibration outcome: $NATIVE_CONTROL_OUTCOME (review with this cohort)"
          extension=""
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then extension=".exe"; fi
          binary="crates/workbook-import-research/target/$TARGET/release/formualizer-execution-boundary-probe$extension"
          "$binary" --catalog
          python crates/workbook-import-research/run_execution_probe.py --binary "$binary" --result-dir "$RUNNER_TEMP/execution-runtime-private"
      - name: Retain selected source and lock on build failure
        if: ${{ !cancelled() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-bootstrap-${{ matrix.target }}
          path: |
            crates/workbook-import-research/Cargo.toml
            crates/workbook-import-research/Cargo.lock
            crates/workbook-import-research/execution.rs
            crates/workbook-import-research/execution-fixtures.json
            crates/workbook-import-research/probe.rs
            crates/workbook-import-research/import-fixtures.json
          if-no-files-found: error
          retention-days: 7
