[package]
name = "formualizer-eval-semantic-research"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone diagnostic, deliberately outside the public checkout workspace.
[workspace]

[[bin]]
name = "formualizer-eval-semantic-probe"
path = "probe.rs"

[dependencies]
formualizer-eval = { git = "https://github.com/psu3d0/formualizer", rev = "dfd2f96457ff0929114a3e6b786c2761e6db5c5d", version = "=0.13.0", default-features = false }
formualizer-parse = { git = "https://github.com/psu3d0/formualizer", rev = "dfd2f96457ff0929114a3e6b786c2761e6db5c5d", version = "=4.1.0", default-features = false }
formualizer-common = { git = "https://github.com/psu3d0/formualizer", rev = "dfd2f96457ff0929114a3e6b786c2761e6db5c5d", version = "=4.1.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"

[profile.release]
panic = "unwind"
debug = 0
lto = false
